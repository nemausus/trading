<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure SPA</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .view { display: none; }
        .active-view { display: block; }
        .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; max-width: 400px; }
        button { margin-top: 10px; padding: 8px 16px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="view-loading" class="view active-view card">
        <p>Checking authentication state...</p>
    </div>

    <div id="view-login" class="view card">
        <h2>Login</h2>
        <input type="email" id="email" placeholder="Email" style="display:block; margin-bottom:10px; width:90%;">
        <input type="password" id="password" placeholder="Password" style="display:block; margin-bottom:10px; width:90%;">
        <button id="btn-login">Sign In</button>
        <p id="login-error" style="color: red;"></p>
    </div>

    <div id="view-main" class="view card" style="max-width: 600px;">
        <h2>Dashboard</h2>
        <p>Welcome, <strong id="user-display-email"></strong></p>

        <hr>

        <h3>Backend Connection</h3>
        <button id="btn-fetch-hello">Fetch Secure Data from app.py</button>
        <p id="api-output" style="color: blue; font-weight: bold;"></p>

        <hr>

        <h3>Schwab Integration</h3>
        <p>Status: <strong id="schwab-status-text" style="color: gray;">Checking...</strong></p>
        <div id="schwab-actions"></div>
        <pre id="schwab-output" style="color: #006600; background-color: #f5f5f5; padding: 10px; border-radius: 4px; border: 1px solid #ddd; max-height: 200px; overflow: auto; font-family: monospace; font-size: 11px; margin-top: 10px; display: none;"></pre>

        <hr>

        <button id="btn-logout">Log Out</button>
    </div>

    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
