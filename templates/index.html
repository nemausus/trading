<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Covered Calls Portfolio Manager</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- LOADING VIEW -->
    <div id="view-loading" class="view active-view center-container">
        <div class="auth-card">
            <h2 style="font-size: 1.4rem; margin-bottom: 0;">Verifying Authentication...</h2>
        </div>
    </div>

    <!-- LOGIN VIEW -->
    <div id="view-login" class="view center-container">
        <div class="auth-card">
            <h2>Sign In</h2>
            <input type="email" id="email" placeholder="Email Address">
            <input type="password" id="password" placeholder="Password">
            <button id="btn-login">Sign In</button>
            <p id="login-error" class="auth-error"></p>
        </div>
    </div>

    <!-- MAIN VIEW -->
    <div id="view-main" class="view">
        <!-- STICKY HEADER -->
        <header class="app-header">
            <div class="header-container">
                <div class="header-left">
                    <div class="header-logo">Antigravity Portfolio</div>
                    <nav class="header-nav">
                        <button id="tab-btn-portfolio" class="nav-tab active">Portfolio</button>
                        <button id="tab-btn-chain" class="nav-tab">Option Chains</button>
                    </nav>
                </div>
                <div class="header-right">
                    <span class="user-email" id="user-display-email"></span>

                    <!-- Schwab Status Pill -->
                    <span id="schwab-status-pill" class="status-pill disconnected">
                        Schwab: <span id="schwab-status-text">Disconnected</span>
                    </span>

                    <!-- Schwab Action Button (Connect/Disconnect) -->
                    <div id="schwab-actions" style="display: inline-block;"></div>

                    <!-- Log Out -->
                    <button id="btn-logout" class="btn-header">Log Out</button>
                </div>
            </div>
        </header>

        <!-- DASHBOARD BODY -->
        <main class="dashboard-container">

            <!-- TAB 1: PORTFOLIO CONTENT -->
            <div id="tab-content-portfolio" class="tab-content active-tab-content">
                <!-- ACCOUNTS SUMMARY CONTAINER -->
                <div id="summaries-container" class="summary-grid">
                    <!-- Dynamically populated summaries -->
                </div>

                <!-- POSITIONS CONTAINER -->
                <div class="section-card">
                    <div class="section-header-row">
                        <h3>Account Positions</h3>
                        <div style="display:flex; align-items:center; gap: 10px;">
                            <button id="btn-group-underlying" class="btn-toggle" data-grouped="false" title="Group positions by underlying symbol">
                                <span class="toggle-icon">⊞</span> Group by Underlying
                            </button>
                            <button id="btn-refresh-portfolio" class="btn-action-refresh" style="display: none;">Refresh Data</button>
                        </div>
                    </div>

                    <div id="positions-container">
                        <div class="no-data-msg">
                            <p>No portfolio data retrieved yet.</p>
                        </div>
                    </div>
                </div>

                <!-- ACTIVE ORDERS CONTAINER -->
                <div class="section-card">
                    <div class="section-header-row">
                        <h3>Working Orders</h3>
                    </div>

                    <div id="orders-container">
                        <div class="no-data-msg">
                            <p>No working orders active.</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- TAB 2: OPTION CHAINS CONTENT -->
            <div id="tab-content-chain" class="tab-content">
                <div class="section-card">
                    <div class="section-header-row" style="margin-bottom: 16px;">
                        <h3>Option Chain Explorer</h3>
                        <div class="quick-presets">
                            <span style="font-size: 0.8rem; color: var(--text-secondary); margin-right: 4px;">Presets:</span>
                            <button class="preset-btn" data-symbol="AAPL">AAPL</button>
                            <button class="preset-btn" data-symbol="AMZN">AMZN</button>
                            <button class="preset-btn" data-symbol="GOOG">GOOG</button>
                            <button class="preset-btn" data-symbol="META">META</button>
                            <button class="preset-btn" data-symbol="MSFT">MSFT</button>
                            <button class="preset-btn" data-symbol="NVDA">NVDA</button>
                            <button class="preset-btn" data-symbol="SPY">SPY</button>
                            <button class="preset-btn" data-symbol="QQQ">QQQ</button>
                            <button class="preset-btn" data-symbol="TSLA">TSLA</button>
                            <button class="preset-btn" data-symbol="$SPX">$SPX</button>
                        </div>
                    </div>

                    <div class="chain-filter-bar">
                        <div class="filter-group">
                            <label for="chain-symbol">Symbol</label>
                            <input type="text" id="chain-symbol" value="AAPL" placeholder="e.g. AAPL" style="text-transform: uppercase;">
                        </div>

                        <div class="filter-group">
                            <label for="chain-type">Contract Type</label>
                            <select id="chain-type">
                                <option value="CALL" selected>Calls Only</option>
                                <option value="ALL">All (Calls & Puts)</option>
                                <option value="PUT">Puts Only</option>
                            </select>
                        </div>

                        <div class="filter-group">
                            <label for="chain-min-dte">Min DTE</label>
                            <input type="number" id="chain-min-dte" value="7" placeholder="7" min="0">
                        </div>

                        <div class="filter-group">
                            <label for="chain-max-dte">Max DTE</label>
                            <input type="number" id="chain-max-dte" value="60" placeholder="60" min="0">
                        </div>

                        <div class="filter-group">
                            <label for="chain-min-delta">Min Delta</label>
                            <input type="number" id="chain-min-delta" value="0.1" placeholder="0.1" step="0.05">
                        </div>

                        <div class="filter-group">
                            <label for="chain-max-delta">Max Delta</label>
                            <input type="number" id="chain-max-delta" value="0.3" placeholder="0.3" step="0.05">
                        </div>

                        <div class="filter-actions">
                            <button id="btn-fetch-chain" class="btn-action-refresh">Fetch Chain</button>
                            <button id="btn-reset-filters" class="btn-toggle">Reset Filters</button>
                        </div>
                    </div>
                </div>

                <!-- UNDERLYING BANNER -->
                <div id="chain-underlying-container"></div>

                <!-- CHAIN TABLE -->
                <div class="section-card">
                    <div id="chain-container">
                        <div class="no-data-msg">
                            <p>Enter a symbol and click "Fetch Chain" to retrieve option contracts.</p>
                        </div>
                    </div>
                </div>
            </div>

        </main>

    </div>

    <!-- Firebase SDKs and main.js -->
    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
