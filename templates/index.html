<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure SPA</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .view { display: none; }
        .active-view { display: block; }
        .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; max-width: 400px; }
        button { margin-top: 10px; padding: 8px 16px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="view-loading" class="view active-view card">
        <p>Checking authentication state...</p>
    </div>

    <div id="view-login" class="view card">
        <h2>Login</h2>
        <input type="email" id="email" placeholder="Email" style="display:block; margin-bottom:10px; width:90%;">
        <input type="password" id="password" placeholder="Password" style="display:block; margin-bottom:10px; width:90%;">
        <button onclick="handleLogin()">Sign In</button>
        <p id="login-error" style="color: red;"></p>
    </div>

    <div id="view-main" class="view card" style="max-width: 600px;">
        <h2>Dashboard</h2>
        <p>Welcome, <strong id="user-display-email"></strong></p>

        <hr>

        <h3>Backend Connection</h3>
        <button onclick="callSecureAPI()">Fetch Secure Data from app.py</button>
        <p id="api-output" style="color: blue; font-weight: bold;"></p>

        <hr>

        <h3>Schwab Integration</h3>
        <p>Status: <strong id="schwab-status-text" style="color: gray;">Checking...</strong></p>
        <div id="schwab-actions"></div>
        <pre id="schwab-output" style="color: #006600; background-color: #f5f5f5; padding: 10px; border-radius: 4px; border: 1px solid #ddd; max-height: 200px; overflow: auto; font-family: monospace; font-size: 11px; margin-top: 10px; display: none;"></pre>

        <hr>

        <button onclick="handleLogout()">Log Out</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        const firebaseConfig = {
            apiKey: "AIzaSyA80IB4rvoqoTo0FCaJhg48bWjSm1n2I4g",
            authDomain: "covered-calls-ab5d1.firebaseapp.com",
            projectId: "covered-calls-ab5d1",
            storageBucket: "covered-calls-ab5d1.firebasestorage.app",
            messagingSenderId: "395032013974",
            appId: "1:395032013974:web:ee980f78db6ce8502fe6b7",
            measurementId: "G-YFWTHS1GY3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // View Router
        function showView(viewId) {
            document.querySelectorAll('.view').forEach(view => {
                view.classList.remove('active-view');
            });
            document.getElementById(viewId).classList.add('active-view');
        }

        // Parse URL params on load
        const urlParams = new URLSearchParams(window.location.search);
        const schwabResult = urlParams.get('schwab');
        const errorMessage = urlParams.get('message');
        if (schwabResult === 'success') {
            alert('Successfully connected to Charles Schwab!');
            window.history.replaceState({}, document.title, window.location.pathname);
        } else if (schwabResult === 'error') {
            alert('Schwab Connection Failed: ' + (errorMessage || 'Unknown error'));
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        // Auth Lifecycle Observer
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('user-display-email').innerText = user.email;
                showView('view-main');
                checkSchwabStatus();
            } else {
                showView('view-login');
                // Clear the API output on logout so the next user doesn't see it
                document.getElementById('api-output').innerText = "";
                const outputPre = document.getElementById('schwab-output');
                if (outputPre) {
                    outputPre.innerText = "";
                    outputPre.style.display = "none";
                }
            }
        });

        // Global functions
        window.handleLogin = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            document.getElementById('login-error').innerText = "";

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                document.getElementById('login-error').innerText = "Authentication failed: " + error.message;
            }
        };

        window.handleLogout = async () => {
            try { await signOut(auth); }
            catch (error) { console.error("Logout failed", error); }
        };

        // Connects to your Python backend
        window.callSecureAPI = async () => {
            const user = auth.currentUser;
            if (!user) return;

            // 1. Get the secure token generated by Firebase
            const token = await user.getIdToken();

            // 2. Send it to app.py
            const response = await fetch('/api/hello', {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            const data = await response.json();

            // 3. Display the response from Python
            if (response.ok) {
                document.getElementById('api-output').innerText = data.message;
            } else {
                document.getElementById('api-output').innerText = "Error: " + data.error;
            }
        };

        async function checkSchwabStatus() {
            const user = auth.currentUser;
            if (!user) return;

            const statusText = document.getElementById('schwab-status-text');
            const actionsDiv = document.getElementById('schwab-actions');
            statusText.innerText = "Checking...";
            statusText.style.color = "gray";

            try {
                const token = await user.getIdToken();
                const response = await fetch('/api/schwab/status', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();

                if (data.connected) {
                    statusText.innerText = "Connected";
                    statusText.style.color = "green";
                    actionsDiv.innerHTML = `
                        <button onclick="fetchSchwabAccounts()">Fetch Account Details</button>
                        <button onclick="disconnectSchwab()" style="background-color: #ffcccc; color: #cc0000; border: 1px solid #cc0000; margin-left: 10px;">Disconnect</button>
                    `;
                } else {
                    statusText.innerText = "Disconnected";
                    statusText.style.color = "red";
                    actionsDiv.innerHTML = `<button onclick="connectSchwab()">Connect Schwab</button>`;
                }
            } catch (error) {
                console.error("Error checking Schwab status:", error);
                statusText.innerText = "Error checking status";
                statusText.style.color = "red";
            }
        }

        window.connectSchwab = async () => {
            const user = auth.currentUser;
            if (!user) return;
            try {
                const token = await user.getIdToken();
                const response = await fetch('/api/auth/schwab', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                if (response.ok && data.url) {
                    window.location.href = data.url;
                } else {
                    alert('Failed to initiate Schwab connection: ' + (data.error || 'Unknown error'));
                }
            } catch (error) {
                console.error("Failed to connect Schwab:", error);
            }
        };

        window.fetchSchwabAccounts = async () => {
            const user = auth.currentUser;
            if (!user) return;
            const outputPre = document.getElementById('schwab-output');
            outputPre.style.display = "block";
            outputPre.innerText = "Fetching accounts...";
            try {
                const token = await user.getIdToken();
                const response = await fetch('/api/schwab/accounts', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                if (response.ok) {
                    outputPre.innerText = JSON.stringify(data, null, 2);
                } else {
                    outputPre.innerText = "Error: " + (data.error || 'Failed to fetch');
                }
            } catch (error) {
                outputPre.innerText = "Error: " + error.message;
            }
        };

        window.disconnectSchwab = async () => {
            if (!confirm("Are you sure you want to disconnect your Schwab account? This will revoke access token storage.")) return;
            const user = auth.currentUser;
            if (!user) return;
            try {
                const token = await user.getIdToken();
                const response = await fetch('/api/schwab/disconnect', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    const outputPre = document.getElementById('schwab-output');
                    outputPre.innerText = "";
                    outputPre.style.display = "none";
                    checkSchwabStatus();
                } else {
                    alert("Failed to disconnect");
                }
            } catch (error) {
                console.error("Disconnect failed", error);
            }
        };
    </script>
</body>
</html>
