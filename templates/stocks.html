<!-- TAB: STOCKS CONTENT -->
<div id="tab-content-stocks" class="tab-content">
    <div class="stocks-tab-container">

        <!-- Controls Card -->
        <div class="section-card">
            <!-- Quick Presets -->
            <div class="section-header-row" style="margin-bottom: 8px;">
                <div class="quick-presets">
                    <span style="font-size: 0.8rem; color: var(--text-secondary); margin-right: 4px;">Presets:</span>
                    <button class="preset-btn stock-preset-btn" data-symbol="AAPL">AAPL</button>
                    <button class="preset-btn stock-preset-btn" data-symbol="NVDA">NVDA</button>
                    <button class="preset-btn stock-preset-btn" data-symbol="MSFT">MSFT</button>
                    <button class="preset-btn stock-preset-btn" data-symbol="AMZN">AMZN</button>
                    <button class="preset-btn stock-preset-btn" data-symbol="GOOG">GOOG</button>
                    <button class="preset-btn stock-preset-btn" data-symbol="META">META</button>
                    <button class="preset-btn stock-preset-btn" data-symbol="TSLA">TSLA</button>
                    <button class="preset-btn stock-preset-btn" data-symbol="SPY">SPY</button>
                    <button class="preset-btn stock-preset-btn" data-symbol="QQQ">QQQ</button>
                </div>
            </div>

            <!-- Top Filter Bar -->
            <div class="stocks-filter-bar">
                <!-- Ticker input + Load button -->
                <div class="stocks-input-group">
                    <label for="stock-ticker-input">Ticker:</label>
                    <input type="text" id="stock-ticker-input" class="stocks-input-ticker" value="AAPL" placeholder="AAPL" maxlength="10">
                    <button id="btn-stock-load" class="btn-stock-load">Load</button>
                </div>

                <!-- Period select -->
                <div class="stocks-input-group">
                    <label for="stock-period-select">Period:</label>
                    <select id="stock-period-select" class="stocks-select">
                        <option value="5D">5D</option>
                        <option value="1M">1M</option>
                        <option value="3M">3M</option>
                        <option value="6M">6M</option>
                        <option value="1Y" selected>1Y</option>
                        <option value="2Y">2Y</option>
                        <option value="5Y">5Y</option>
                    </select>
                </div>

                <!-- Interval select -->
                <div class="stocks-input-group">
                    <label for="stock-interval-select">Interval:</label>
                    <select id="stock-interval-select" class="stocks-select">
                        <option value="1M">1m</option>
                        <option value="5M">5m</option>
                        <option value="15M">15m</option>
                        <option value="30M">30m</option>
                        <option value="1D" selected>1D</option>
                        <option value="1W">1W</option>
                        <option value="1MO">1MO</option>
                    </select>
                </div>
            </div>

            <!-- Indicator Checkboxes Bar -->
            <div class="indicators-bar">
                <label class="indicator-checkbox-label">
                    <input type="checkbox" id="toggle-sma50" checked>
                    <span class="indicator-dot dot-sma50"></span>
                    SMA 50
                </label>
                <label class="indicator-checkbox-label">
                    <input type="checkbox" id="toggle-sma200" checked>
                    <span class="indicator-dot dot-sma200"></span>
                    SMA 200
                </label>
                <label class="indicator-checkbox-label">
                    <input type="checkbox" id="toggle-volume" checked>
                    <span class="indicator-dot dot-volume"></span>
                    Volume
                </label>
                <label class="indicator-checkbox-label">
                    <input type="checkbox" id="toggle-rsi" checked>
                    <span class="indicator-dot dot-rsi"></span>
                    RSI 14
                </label>
            </div>
        </div>

        <!-- Status / Error message banner -->
        <div id="stock-status-msg" style="display: none;"></div>

        <!-- Stock Overview Banner (Ticker, Price, Daily Change) -->
        <div id="stock-overview-banner" class="stock-overview-banner" style="display: none;"></div>

        <!-- Chart Section Card -->
        <div class="stock-chart-card">
            <!-- Dynamic OHLCV & Indicator live hover legend -->
            <div id="stock-chart-legend" class="stock-chart-legend"></div>

            <!-- Lightweight Charts Container -->
            <div id="stock-chart-wrapper" class="stock-chart-wrapper"></div>
        </div>

    </div>
</div>
